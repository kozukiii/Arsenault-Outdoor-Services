name: Update Google reviews

on:
  schedule:
    - cron: '17 8 * * *'   # daily, ~08:17 UTC
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch reviews from Google Places
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node fetch-reviews.mjs

      - name: Commit reviews.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- reviews.json; then
            git add reviews.json
            git commit -m "Update Google reviews [skip ci]"
            git push
          else
            echo "No review changes."
          fi
